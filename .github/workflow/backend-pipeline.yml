name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pipeline.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (e.g., Docker Hub or AWS ECR)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: your-dockerhub-username/backend-service:latest

      - name: Deploy to Server / Cloud Environment
        run: |
          echo "Triggering backend deployment via SSH or cloud webhook..."
          # Add your SSH deployment script or AWS ECS deployment command here
          # ssh user@your-server "docker pull your-dockerhub-username/backend-service:latest && docker-compose up -d"